# Production Profile Configuration
spring:
  # Database Configuration (all from environment variables)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: false

  # Disable dev tools in production
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# Stock Data Provider Configuration
stock:
  data:
    twelve-data:
      api-key: ${TWELVE_DATA_API_KEY}
      base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
    alpha-vantage:
      api-key: ${ALPHA_VANTAGE_API_KEY:}

    update-enabled: true
    update-cron: "0 0 2 1 * *"

# Actuator — restrict details in production
management:
  endpoint:
    health:
      show-details: never

# Logging — minimal in production
logging:
  level:
    root: WARN
    com.moshimo: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS — from environment variable (e.g., https://moshimo.app)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
