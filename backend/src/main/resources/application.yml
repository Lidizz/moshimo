# Base Configuration (Shared across all profiles)
spring:
  application:
    name: moshimo-backend

  # Default to dev profile for local development.
  # Override in production: SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: dev

# Server configuration
server:
  port: 8080

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging (profiles override with more/less verbosity)
logging:
  level:
    root: INFO
    com.moshimo: INFO